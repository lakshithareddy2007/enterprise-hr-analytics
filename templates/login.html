<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Enterprise HR Analytics Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Enterprise HR Analytics</h1>

        <h3>Administrator Login</h3>

        <form action="/login" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <br><br>

            <button type="submit">

                Login

            </button>

        </form>

        {% if error %}

        <p style="color:red;">

            {{ error }}

        </p>

        {% endif %}

    </div>

</div>

</body>

</html>
